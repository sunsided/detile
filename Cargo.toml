[package]
name = "detile"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tile-detect"
path = "src/main.rs"

[features]
default = []
ui = ["dep:eframe"]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
eframe = { version = "0.29", optional = true }

[dev-dependencies]
