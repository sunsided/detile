[package]
name = "detile"
version = "0.1.1"
edition = "2024"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
repository = "https://github.com/sunsided/detile"
license = "EUPL-1.2"
rust-version = "1.95"
description = "Detect regular tile grids in images (sprite sheets, tile atlases, game maps) and recover the tileset, via 1D autocorrelation."
readme = "README.md"
keywords = ["tilemap", "spritesheet", "tileset", "grid", "atlas"]
categories = ["command-line-utilities", "multimedia::images", "computer-vision", "game-development", "graphics"]
exclude = ["reference/", ".readme/"]

[[bin]]
name = "detile"
path = "src/main.rs"

[features]
default = []
ui = ["dep:eframe"]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
eframe = { version = "0.29", optional = true }

[dev-dependencies]
